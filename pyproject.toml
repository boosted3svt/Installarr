[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "installarr"
version = "0.1.0"
description = "Headless media stack installer"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
installarr = "installarr.cli:main"

[tool.setuptools.packages.find]
include = ["installarr*"]
